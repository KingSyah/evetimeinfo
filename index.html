<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="refresh" content="4; url=https://evetime.kingsyah.my.id/" />
    <meta name="theme-color" content="#73d7f5" />
    <link rel="canonical" href="https://evetime.kingsyah.my.id/" />
    <title>Evetime — Mengalihkan...</title>
    <style>
      :root {
        color-scheme: light;
        --sky-top: #70d7f5;
        --sky-bottom: #d9f7ff;
        --ink: #204455;
        --yellow: #ffd447;
        --yellow-dark: #e9a82f;
        --green: #63c85b;
        --green-dark: #329447;
        --ground: #e8c76f;
      }

      * { box-sizing: border-box; }

      html, body { min-height: 100%; }

      body {
        margin: 0;
        overflow: hidden;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: var(--ink);
        background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-bottom) 78%, #f5fcff 100%);
      }

      .scene {
        position: relative;
        min-height: 100vh;
        isolation: isolate;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .sun {
        position: absolute;
        z-index: -2;
        top: 9vh;
        right: 12vw;
        width: 92px;
        height: 92px;
        border-radius: 50%;
        background: #ffe99a;
        box-shadow: 0 0 0 16px rgba(255, 233, 154, .2), 0 0 55px rgba(255, 233, 154, .7);
      }

      .cloud {
        position: absolute;
        z-index: -1;
        width: 150px;
        height: 34px;
        border-radius: 30px;
        background: rgba(255,255,255,.8);
        filter: drop-shadow(0 8px 0 rgba(117, 201, 221, .12));
        animation: drift 24s linear infinite;
      }
      .cloud::before, .cloud::after {
        content: "";
        position: absolute;
        bottom: 7px;
        border-radius: 50%;
        background: inherit;
      }
      .cloud::before { left: 24px; width: 54px; height: 54px; }
      .cloud::after { left: 72px; width: 70px; height: 70px; }
      .cloud.one { top: 15%; left: -170px; transform: scale(.7); animation-duration: 28s; }
      .cloud.two { top: 29%; left: -220px; transform: scale(.45); animation-duration: 36s; animation-delay: -12s; opacity: .75; }

      .card {
        width: min(100%, 470px);
        position: relative;
        overflow: hidden;
        text-align: center;
        padding: 30px 26px 28px;
        border: 4px solid rgba(32, 68, 85, .12);
        border-radius: 28px;
        background: rgba(255, 255, 255, .9);
        box-shadow: 0 22px 0 rgba(32, 68, 85, .08), 0 30px 70px rgba(34, 125, 160, .22);
        backdrop-filter: blur(10px);
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        margin-bottom: 12px;
        font-size: 13px;
        font-weight: 800;
        letter-spacing: .14em;
        text-transform: uppercase;
        color: #3a9eb6;
      }
      .brand-mark {
        width: 12px;
        height: 12px;
        border-radius: 4px 7px 4px 7px;
        background: var(--yellow);
        border: 2px solid var(--yellow-dark);
        transform: rotate(-10deg);
      }

      .bird-wrap {
        position: relative;
        width: 92px;
        height: 92px;
        margin: 2px auto 12px;
        animation: bob 1.1s ease-in-out infinite alternate;
      }
      .bird {
        position: absolute;
        top: 16px;
        left: 13px;
        width: 62px;
        height: 49px;
        border: 4px solid #b87924;
        border-radius: 52% 48% 45% 50%;
        background: var(--yellow);
        box-shadow: inset -5px -5px 0 rgba(216, 145, 37, .18);
      }
      .bird::before {
        content: "";
        position: absolute;
        top: 12px;
        right: -17px;
        width: 22px;
        height: 14px;
        border: 3px solid #c5662f;
        border-radius: 2px 10px 10px 2px;
        background: #ff9550;
      }
      .bird::after {
        content: "";
        position: absolute;
        top: 10px;
        right: 10px;
        width: 11px;
        height: 11px;
        border-radius: 50%;
        background: white;
        box-shadow: inset -1px -1px 0 #bad7dd;
      }
      .eye {
        position: absolute;
        z-index: 1;
        top: 14px;
        right: 13px;
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: var(--ink);
      }
      .wing {
        position: absolute;
        left: 9px;
        bottom: 6px;
        width: 28px;
        height: 17px;
        border: 3px solid #c38a29;
        border-radius: 50% 35% 55% 45%;
        background: #f9bd35;
        transform: rotate(12deg);
      }

      h1 {
        margin: 0;
        font-size: clamp(29px, 7vw, 42px);
        line-height: 1.05;
        letter-spacing: -.04em;
        color: #204455;
      }
      .subtitle {
        margin: 11px auto 20px;
        max-width: 330px;
        font-size: 15px;
        line-height: 1.55;
        color: #607d88;
      }

      .progress {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 0 auto 20px;
        max-width: 330px;
        text-align: left;
      }
      .progress-track {
        flex: 1;
        height: 10px;
        overflow: hidden;
        border-radius: 99px;
        background: #e7f1f3;
        box-shadow: inset 0 2px 3px rgba(32,68,85,.08);
      }
      .progress-bar {
        width: 100%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #6bcf68, #f4d04d);
        transform-origin: left;
        animation: drain 4s linear forwards;
      }
      #countdown {
        min-width: 67px;
        font-size: 12px;
        font-weight: 800;
        color: #67909c;
      }

      .button {
        display: inline-block;
        padding: 13px 22px;
        border: 0;
        border-radius: 14px;
        background: var(--green);
        color: white;
        font: inherit;
        font-size: 14px;
        font-weight: 800;
        text-decoration: none;
        box-shadow: 0 5px 0 var(--green-dark);
        transition: transform .15s ease, box-shadow .15s ease, background .15s ease;
      }
      .button:hover { background: #55b951; transform: translateY(-2px); box-shadow: 0 7px 0 var(--green-dark); }
      .button:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--green-dark); }

      .pipes {
        position: absolute;
        z-index: -1;
        right: 7vw;
        bottom: 11vh;
        width: 49px;
        height: 210px;
        opacity: .9;
      }
      .pipe { position: absolute; width: 49px; border: 4px solid var(--green-dark); background: var(--green); box-shadow: inset 7px 0 rgba(255,255,255,.18); }
      .pipe.top { top: 0; height: 105px; border-radius: 3px 3px 0 0; }
      .pipe.top::after, .pipe.bottom::before { content: ""; position: absolute; left: -10px; width: 61px; height: 21px; border: 4px solid var(--green-dark); background: var(--green); }
      .pipe.top::after { bottom: -4px; border-radius: 5px; }
      .pipe.bottom { bottom: 0; height: 88px; border-radius: 0 0 3px 3px; }
      .pipe.bottom::before { top: -4px; border-radius: 5px; }

      .ground {
        position: absolute;
        z-index: -1;
        right: 0;
        bottom: 0;
        left: 0;
        height: 9vh;
        min-height: 54px;
        border-top: 8px solid #77c95d;
        background: repeating-linear-gradient(135deg, #efd17a 0 18px, #e8c76f 18px 36px);
        box-shadow: 0 -4px 0 rgba(53, 146, 71, .18);
      }

      .note {
        margin-top: 17px;
        font-size: 11px;
        color: #88a2aa;
      }

      @keyframes bob { from { transform: translateY(4px) rotate(3deg); } to { transform: translateY(-5px) rotate(-4deg); } }
      @keyframes drain { from { transform: scaleX(1); } to { transform: scaleX(0); } }
      @keyframes drift { from { left: -180px; } to { left: calc(100vw + 180px); } }
      @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; } }
      @media (max-width: 560px) {
        .scene { padding: 18px; }
        .card { padding: 27px 20px 24px; border-radius: 24px; }
        .pipes { right: 2vw; transform: scale(.72); transform-origin: bottom right; }
        .sun { right: -18px; top: 6vh; transform: scale(.72); }
      }
    </style>
  </head>
  <body>
    <main class="scene" aria-label="Halaman pengalihan Evetime">
      <div class="sun" aria-hidden="true"></div>
      <div class="cloud one" aria-hidden="true"></div>
      <div class="cloud two" aria-hidden="true"></div>

      <section class="card">
        <div class="brand"><span class="brand-mark" aria-hidden="true"></span> Evetime</div>
        <div class="bird-wrap" aria-hidden="true">
          <div class="bird"><span class="eye"></span><span class="wing"></span></div>
        </div>
        <h1>Terbang ke Evetime!</h1>
        <p class="subtitle">Halaman baru sedang menunggu. Kamu akan diarahkan secara otomatis dalam beberapa detik.</p>
        <div class="progress" aria-live="polite">
          <div class="progress-track" aria-hidden="true"><div class="progress-bar"></div></div>
          <span id="countdown">3 detik</span>
        </div>
        <a class="button" href="https://evetime.kingsyah.my.id/">Buka Evetime sekarang</a>
        <div class="note">Jika tidak berpindah otomatis, gunakan tombol di atas.</div>
      </section>

      <div class="pipes" aria-hidden="true">
        <div class="pipe top"></div>
        <div class="pipe bottom"></div>
      </div>
      <div class="ground" aria-hidden="true"></div>
    </main>

    <script>
      (function () {
        var destination = "https://evetime.kingsyah.my.id/";
        var remaining = 3;
        var label = document.getElementById("countdown");
        var timer = window.setInterval(function () {
          remaining -= 1;
          if (remaining > 0) {
            label.textContent = remaining + " detik";
          } else {
            label.textContent = "Mengalihkan...";
            window.clearInterval(timer);
            window.location.replace(destination);
          }
        }, 1000);
      })();
    </script>
  </body>
</html>
